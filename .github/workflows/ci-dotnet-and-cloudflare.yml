name: CI - Cloudflare Relay & .NET 10 MAUI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  cloudflare-relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test

  dotnet-core-and-maui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-maui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/nOpenWrtRemote.Core.Tests/nOpenWrtRemote.Core.Tests.csproj -c Release
      - run: dotnet build src/nOpenWrtRemote.MockRouter/nOpenWrtRemote.MockRouter.csproj -c Release
      - run: sudo dotnet workload install maui-android
      - run: dotnet build src/nOpenWrtRemote.App/nOpenWrtRemote.App.csproj -t:InstallAndroidDependencies -f net10.0-android -c Release -p:AndroidSdkDirectory="${ANDROID_HOME}" -p:AcceptAndroidSDKLicenses=true
      - run: dotnet build src/nOpenWrtRemote.App/nOpenWrtRemote.App.csproj -f net10.0-android -c Release -p:AndroidSdkDirectory="${ANDROID_HOME}" -p:AcceptAndroidSDKLicenses=true
